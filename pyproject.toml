[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hikari"
version = "0.1.0"
description = "Variable star photometry application for AAVSO reporting"
requires-python = ">=3.11"
dependencies = [
    # Astronomy
    "astropy>=6.0",
    "photutils>=1.12",
    # Data
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    # Visualization
    "matplotlib>=3.8",
    # Config & validation
    "pydantic>=2.6",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # HTTP
    "httpx>=0.27",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Web dashboard
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Logging
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
hikari = "hikari.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["hikari"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
