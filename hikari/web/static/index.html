<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hikari – Photometry Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --success: #3fb950;
      --fail: #f85149;
      --warn: #e3b341;
      --text: #c9d1d9;
      --muted: #8b949e;
      --font: 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; display: flex; flex-direction: column; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.3rem; color: var(--accent); }
    header span { color: var(--muted); font-size: 0.85rem; }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 360px 1fr 380px;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .col-runs { min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    .col-obs  { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .col-viz  { min-height: 0; overflow-y: auto; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── New Run form ── */
    #new-run-panel { flex-shrink: 0; }
    .new-run-body { padding: 12px; display: flex; gap: 8px; }
    #path-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 10px;
      color: var(--text);
      font-size: 0.82rem;
      font-family: monospace;
    }
    #path-input:focus { outline: none; border-color: var(--accent); }

    /* ── Run list ── */
    #run-list-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    #run-list { flex: 1; overflow-y: auto; }

    .run-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .run-item:last-child { border-bottom: none; }
    .run-item:hover, .run-item.active { background: #21262d; }
    .run-item .run-path { font-family: monospace; font-size: 0.78rem; color: var(--text); margin-bottom: 4px; word-break: break-all; }
    .run-item .run-meta { font-size: 0.78rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-success  { background: #1a3a23; color: var(--success); }
    .badge-complete { background: #1a3a23; color: var(--success); }
    .badge-fail     { background: #3a1a1a; color: var(--fail); }
    .badge-failed   { background: #3a1a1a; color: var(--fail); }
    .badge-pending  { background: #2a2a1a; color: var(--warn); }
    .badge-running  { background: #1a2a3a; color: var(--accent); }

    /* ── Run detail (center col) ── */
    #detail-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    #detail-header { padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #detail-header h2 { font-size: 1rem; font-family: monospace; word-break: break-all; }
    #detail-header .sub { color: var(--muted); font-size: 0.82rem; margin-top: 6px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    /* ── Progress bar ── */
    .progress-wrap { padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .progress-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .progress-bar-track { background: var(--border); border-radius: 4px; height: 6px; overflow: hidden; }
    .progress-bar-fill  { background: var(--accent); height: 100%; border-radius: 4px; transition: width 0.3s; }

    /* ── Job accordion ── */
    .jobs-scroll { flex: 1; overflow-y: auto; }
    .job-section { border-bottom: 1px solid var(--border); }
    .job-section:last-child { border-bottom: none; }
    .job-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .job-header:hover { background: #21262d; }
    .job-header .expand-icon { color: var(--muted); font-size: 0.75rem; width: 12px; }
    .job-header .job-title { font-weight: 600; flex: 1; }
    .job-header .job-counts { font-size: 0.78rem; color: var(--muted); }

    /* obs table inside accordion */
    .job-obs { display: none; }
    .job-obs.open { display: block; }

    .toolbar {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar .info { margin-left: auto; color: var(--muted); font-size: 0.8rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th {
      text-align: left; padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted); font-weight: 600;
      text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em;
      position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    td { padding: 7px 12px; border-bottom: 1px solid #21262d; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr.rejected td { opacity: 0.45; text-decoration: line-through; }
    tr:hover td { background: #21262d22; }

    .mag { font-family: monospace; }
    .rms-good { color: var(--success); }
    .rms-warn { color: var(--warn); }
    .rms-bad  { color: var(--fail); }

    button {
      cursor: pointer; border: 1px solid var(--border); border-radius: 5px;
      padding: 4px 10px; font-size: 0.78rem; background: transparent;
      color: var(--text); transition: background 0.15s;
    }
    button:hover { background: #21262d; }
    button.danger  { border-color: var(--fail);    color: var(--fail); }
    button.primary { border-color: var(--accent);  color: var(--accent); }
    button.sm      { padding: 2px 8px; font-size: 0.72rem; }

    .empty { padding: 40px; text-align: center; color: var(--muted); }

    .spinner { display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 18px; font-size: 0.85rem;
      display: none; z-index: 999; box-shadow: 0 4px 20px #0005;
    }

    tr.obs-selected td { background: #1c2b3a !important; }
    tr.obs-clickable   { cursor: pointer; }

    /* ── Viz panel ── */
    #viz-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    #viz-panel-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      font-weight: 600; font-size: 0.85rem; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted);
    }
    #viz-filename {
      font-size: 0.8rem; color: var(--muted); padding: 8px 16px;
      border-bottom: 1px solid var(--border); min-height: 33px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #viz-empty { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 0.85rem; }
    .viz-cards { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .viz-card { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
    .viz-card h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; }
    #cutout-wrap { display: flex; align-items: center; justify-content: center; min-height: 120px; }
    #cutout-img { max-width: 100%; image-rendering: pixelated; }
    #cutout-placeholder { color: var(--muted); font-size: 0.8rem; }

    /* ── Directory picker modal ── */
    #dir-modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: #0009; z-index: 100;
      align-items: center; justify-content: center;
    }
    #dir-modal-backdrop.open { display: flex; }
    #dir-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; width: 560px; max-height: 70vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 8px 40px #0008;
    }
    #dir-modal-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-weight: 600; display: flex; align-items: center; gap: 10px;
    }
    #dir-modal-header .title { flex: 1; font-size: 0.9rem; }
    #dir-modal-path {
      padding: 8px 16px; font-family: monospace; font-size: 0.78rem;
      color: var(--muted); background: var(--bg);
      border-bottom: 1px solid var(--border);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #dir-entries {
      flex: 1; overflow-y: auto;
    }
    .dir-entry {
      padding: 9px 16px; cursor: pointer; display: flex; align-items: center;
      gap: 10px; border-bottom: 1px solid #21262d; font-size: 0.85rem;
      transition: background 0.1s;
    }
    .dir-entry:last-child { border-bottom: none; }
    .dir-entry:hover { background: #21262d; }
    .dir-entry .dir-icon { color: var(--warn); font-size: 1rem; }
    #dir-modal-footer {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
    }
  </style>
</head>
<body>

<header>
  <h1>⭐ Hikari</h1>
  <span>Variable Star Photometry</span>
</header>

<main>
  <!-- Column 1: New Run + Run list -->
  <div class="col-runs">
    <div class="panel" id="new-run-panel">
      <div class="panel-header">New Run</div>
      <div class="new-run-body">
        <input type="text" id="path-input" placeholder="/path/to/fits/directory"
               onkeydown="if(event.key==='Enter') startRun()" />
        <button onclick="openDirPicker()" title="Browse filesystem">📁</button>
        <button class="primary" onclick="startRun()" id="start-btn">Process</button>
      </div>
    </div>

    <div class="panel" id="run-list-panel">
      <div class="panel-header">
        Runs
        <button class="sm" onclick="loadRuns()" style="margin-left:auto">Refresh</button>
        <button class="sm" onclick="clearCache()">Clear Cache</button>
        <button class="sm danger" onclick="clearAllData()">Clear All</button>
      </div>
      <div id="run-list">
        <div class="empty">Loading…</div>
      </div>
    </div>
  </div>

  <!-- Column 2: Run detail -->
  <div class="col-obs">
    <div class="panel" id="detail-panel">
      <div class="empty" style="padding:60px">Select a run or start a new one</div>
    </div>
  </div>

  <!-- Column 3: Viz panel -->
  <div class="col-viz">
    <div id="viz-panel">
      <div id="viz-panel-header">Detail</div>
      <div id="viz-filename"></div>
      <div id="viz-empty">Click an observation row to see the ensemble fit and target cutout</div>
      <div id="viz-cards" class="viz-cards" style="display:none">
        <div class="viz-card">
          <h4>Ensemble Fit</h4>
          <canvas id="ensemble-chart" height="220"></canvas>
        </div>
        <div class="viz-card">
          <h4>Target Cutout</h4>
          <div id="cutout-wrap">
            <span id="cutout-placeholder" class="muted">Loading…</span>
            <img id="cutout-img" style="display:none" alt="target cutout" />
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Directory picker modal -->
<div id="dir-modal-backdrop">
  <div id="dir-modal">
    <div id="dir-modal-header">
      <span class="title">Select Directory</span>
      <button class="sm" onclick="closeDirPicker()">✕</button>
    </div>
    <div id="dir-modal-path"></div>
    <div id="dir-entries"></div>
    <div id="dir-modal-footer">
      <button onclick="closeDirPicker()">Cancel</button>
      <button class="primary" onclick="confirmDirPicker()" id="dir-select-btn">Select This Directory</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let currentRunId   = null;
  let expandedJobId  = null;
  let currentJobObs  = {};   // jobId → obs array
  let ensembleChart  = null;
  let pollTimer      = null;

  // ── API helpers ─────────────────────────────────────────────────────────────
  async function api(url, opts = {}) {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }

  function toast(msg, err = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    el.style.borderColor = err ? 'var(--fail)' : 'var(--success)';
    setTimeout(() => { el.style.display = 'none'; }, 3500);
  }

  // ── Run list ───────────────────────────────────────────────────────────────
  async function loadRuns() {
    const el = document.getElementById('run-list');
    try {
      const runs = await api('/api/runs?limit=50');
      if (!runs.length) { el.innerHTML = '<div class="empty">No runs yet. Process a directory above.</div>'; return; }
      el.innerHTML = runs.map(runItem).join('');
      if (currentRunId) {
        document.querySelector(`.run-item[data-id="${currentRunId}"]`)?.classList.add('active');
      }
    } catch(e) {
      el.innerHTML = `<div class="empty" style="color:var(--fail)">${e.message}</div>`;
    }
  }

  function badgeClass(status) {
    return `badge-${status}`;
  }

  function runItem(r) {
    const dt = new Date(r.created_at).toLocaleString();
    const pathShort = r.source_path.split('/').slice(-2).join('/');
    return `<div class="run-item" data-id="${r.id}" onclick="selectRun(${r.id})">
      <div class="run-path" title="${esc(r.source_path)}">${esc(pathShort)}</div>
      <div class="run-meta">
        <span>${dt}</span>
        <span class="badge ${badgeClass(r.status)}">${r.status}</span>
        <span>${r.n_jobs} job${r.n_jobs !== 1 ? 's' : ''}</span>
        <span>${r.n_observations} obs</span>
        ${r.notes ? `<span title="${esc(r.notes)}" style="color:var(--accent)">✎</span>` : ''}
      </div>
    </div>`;
  }

  // ── New run ────────────────────────────────────────────────────────────────
  async function startRun() {
    const input = document.getElementById('path-input');
    const path = input.value.trim();
    if (!path) { toast('Enter a directory path first', true); return; }

    const btn = document.getElementById('start-btn');
    btn.disabled = true;
    btn.textContent = 'Starting…';

    try {
      const run = await api('/api/runs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source_path: path }),
      });
      toast(`Run #${run.id} started`);
      input.value = '';
      await loadRuns();
      selectRun(run.id);
    } catch(e) {
      toast(e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Process';
    }
  }

  // ── Run detail ─────────────────────────────────────────────────────────────
  async function selectRun(runId) {
    stopPolling();
    currentRunId = runId;
    expandedJobId = null;
    currentJobObs = {};

    document.querySelectorAll('.run-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.run-item[data-id="${runId}"]`)?.classList.add('active');

    const panel = document.getElementById('detail-panel');
    panel.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
    resetVizPanel();

    await refreshRunDetail(runId);

    // Poll if still running
    const r = await api(`/api/runs/${runId}`).catch(() => null);
    if (r && r.status === 'running') {
      pollTimer = setInterval(() => pollRun(runId), 2000);
    }
  }

  async function refreshRunDetail(runId) {
    try {
      const [run, jobs] = await Promise.all([
        api(`/api/runs/${runId}`),
        api(`/api/runs/${runId}/jobs`),
      ]);
      renderRunDetail(run, jobs);
    } catch(e) {
      document.getElementById('detail-panel').innerHTML =
        `<div class="empty" style="color:var(--fail)">${e.message}</div>`;
    }
  }

  async function pollRun(runId) {
    try {
      const run = await api(`/api/runs/${runId}`);
      if (run.status !== 'running') {
        stopPolling();
        await loadRuns();
      }
      // Re-render detail (preserves expanded state via expandedJobId)
      const jobs = await api(`/api/runs/${runId}/jobs`);
      renderRunDetail(run, jobs);
    } catch(e) { /* silently ignore poll errors */ }
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function renderRunDetail(run, jobs) {
    const panel = document.getElementById('detail-panel');
    const dt = new Date(run.created_at).toLocaleString();
    const totalObs = jobs.reduce((s, j) => s + j.n_observations, 0);
    const totalFailed = jobs.reduce((s, j) => s + j.n_failed, 0);

    // Progress section (only while running)
    let progressHtml = '';
    if (run.status === 'running') {
      const prog = run.progress || {};
      const total = prog.total || 1;
      const completed = prog.completed || 0;
      const pct = Math.round((completed / total) * 100);
      const label = prog.current_group ? `Processing: ${esc(prog.current_group)}` : 'Starting…';
      progressHtml = `
        <div class="progress-wrap">
          <div class="progress-label"><span class="spinner"></span> &nbsp;${label} (${completed}/${total})</div>
          <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        </div>`;
    }

    // Job sections
    const jobSections = jobs.map(j => jobSection(j)).join('');

    panel.innerHTML = `
      <div id="detail-header">
        <h2>${esc(run.source_path)}</h2>
        <div class="sub">
          <span>${dt}</span>
          <span class="badge ${badgeClass(run.status)}">${run.status}</span>
          <span>${jobs.length} job${jobs.length !== 1 ? 's' : ''}</span>
          <span>${totalObs} obs accepted${totalFailed ? ` · <span style="color:var(--fail)">${totalFailed} failed</span>` : ''}</span>
        </div>
      </div>
      ${progressHtml}
      <div class="toolbar" style="flex-shrink:0">
        <button class="primary" onclick="downloadRunCsv(${run.id})">Download AAVSO CSV</button>
        <button class="danger" onclick="deleteRun(${run.id})" style="margin-left:auto">Delete Run</button>
      </div>
      <div style="padding:10px 16px; border-bottom:1px solid var(--border); flex-shrink:0">
        <textarea id="run-notes" rows="2"
          placeholder="Notes (e.g. uploaded to AAVSO, poor seeing…)"
          onblur="saveRunNotes(${run.id})"
          style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:5px;
                 color:var(--text); font-family:var(--font); font-size:0.82rem; padding:6px 10px;
                 resize:vertical; outline:none;"
          onfocus="this.style.borderColor='var(--accent)'"
          onblur="this.style.borderColor='var(--border)'; saveRunNotes(${run.id})"
        >${esc(run.notes || '')}</textarea>
      </div>
      <div class="jobs-scroll">
        <div id="job-accordion">${jobSections || '<div class="empty">No jobs yet.</div>'}</div>
      </div>`;

    // Re-attach obs table click handlers for already-expanded job
    if (expandedJobId && currentJobObs[expandedJobId]) {
      const wrap = document.getElementById(`job-obs-${expandedJobId}`);
      if (wrap) {
        const obsDiv = wrap.querySelector('.obs-table-wrap');
        if (obsDiv) attachObsClicks(obsDiv, currentJobObs[expandedJobId]);
      }
    }
  }

  function jobSection(j) {
    const isOpen = j.id === expandedJobId;
    const nOk = j.n_observations;
    const nFail = j.n_failed;
    const failStr = nFail ? ` · <span style="color:var(--fail)">${nFail} failed</span>` : '';
    const icon = isOpen ? '▼' : '▶';

    let obsContent = '';
    if (isOpen && currentJobObs[j.id]) {
      obsContent = renderObsTable(j.id, currentJobObs[j.id]);
    }

    return `<div class="job-section" id="job-section-${j.id}">
      <div class="job-header" onclick="toggleJob(${j.id})">
        <span class="expand-icon" id="icon-${j.id}">${icon}</span>
        <span class="job-title">${esc(j.object_name)} / <span style="color:var(--muted)">${esc(j.filter)}</span></span>
        <span class="job-counts">${nOk} obs${failStr}</span>
      </div>
      <div class="job-obs${isOpen ? ' open' : ''}" id="job-obs-${j.id}">
        ${isOpen ? obsContent : ''}
      </div>
    </div>`;
  }

  async function toggleJob(jobId) {
    if (expandedJobId === jobId) {
      // Collapse
      expandedJobId = null;
      const obs = document.getElementById(`job-obs-${jobId}`);
      if (obs) { obs.classList.remove('open'); obs.innerHTML = ''; }
      const icon = document.getElementById(`icon-${jobId}`);
      if (icon) icon.textContent = '▶';
      return;
    }

    // Collapse previous
    if (expandedJobId) {
      const prev = document.getElementById(`job-obs-${expandedJobId}`);
      if (prev) { prev.classList.remove('open'); prev.innerHTML = ''; }
      const prevIcon = document.getElementById(`icon-${expandedJobId}`);
      if (prevIcon) prevIcon.textContent = '▶';
    }

    expandedJobId = jobId;
    const obsDiv = document.getElementById(`job-obs-${jobId}`);
    const icon = document.getElementById(`icon-${jobId}`);
    if (icon) icon.textContent = '▼';
    if (obsDiv) {
      obsDiv.classList.add('open');
      obsDiv.innerHTML = '<div class="empty"><span class="spinner"></span></div>';

      try {
        const obs = await api(`/api/jobs/${jobId}/observations`);
        currentJobObs[jobId] = obs;
        obsDiv.innerHTML = renderObsTable(jobId, obs);
        attachObsClicks(obsDiv, obs);
      } catch(e) {
        obsDiv.innerHTML = `<div class="empty" style="color:var(--fail)">${e.message}</div>`;
      }
    }
  }

  function renderObsTable(jobId, obs) {
    const rows = obs.map(o => obsRow(o)).join('');
    return `
      <div class="toolbar" style="border-top:1px solid var(--border); background:var(--bg)">
        <span class="info">${obs.length} obs (${obs.filter(o=>o.rejected).length} rejected)</span>
      </div>
      <div class="obs-table-wrap">
        <table>
          <thead>
            <tr>
              <th>File</th><th>JD</th><th>Mag</th><th>±Err</th>
              <th>RMS fit</th><th>N ens</th><th>Chk Star</th>
              <th>Airmass</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="10" class="empty">No observations</td></tr>`}</tbody>
        </table>
      </div>`;
  }

  function attachObsClicks(container, obs) {
    container.querySelectorAll('tr.obs-clickable').forEach(tr => {
      tr.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        const o = obs.find(x => x.id === parseInt(tr.dataset.obsId));
        if (o) selectObsRow(o);
      });
    });
  }

  // ── Observation row ─────────────────────────────────────────────────────────
  function rmsClass(rms) {
    if (rms == null) return '';
    if (rms < 0.03) return 'rms-good';
    if (rms < 0.07) return 'rms-warn';
    return 'rms-bad';
  }

  function obsRow(o) {
    const rejected = o.rejected;
    const mag = o.magnitude  != null ? o.magnitude.toFixed(3)       : '—';
    const err = o.magnitude_error != null ? o.magnitude_error.toFixed(3) : '—';
    const rms = o.fit_rms    != null ? o.fit_rms.toFixed(4)         : '—';
    const am  = o.airmass    != null ? o.airmass.toFixed(2)         : '—';
    const jd  = o.julian_date       ? o.julian_date.toFixed(5)      : '—';
    const badge = o.status === 'success'
      ? `<span class="badge badge-success">ok</span>`
      : `<span class="badge badge-fail">${esc(o.status)}</span>`;
    const rejectBtn = rejected
      ? `<button class="sm primary" onclick="acceptObs(${o.id},event)">Accept</button>`
      : `<button class="sm danger"  onclick="rejectObs(${o.id},event)">Reject</button>`;

    let chkCell;
    if (!o.check_star_auid) {
      chkCell = '<td>—</td>';
    } else {
      const shortAuid = o.check_star_auid.split('-').pop();
      const pub   = o.check_star_published_magnitude != null ? o.check_star_published_magnitude.toFixed(3) : '?';
      const cal   = o.check_star_magnitude != null ? o.check_star_magnitude.toFixed(3) : '?';
      const delta = (o.check_star_published_magnitude != null && o.check_star_magnitude != null)
        ? Math.abs(o.check_star_magnitude - o.check_star_published_magnitude).toFixed(3) : '?';
      chkCell = `<td title="${esc(o.check_star_auid)} | pub=${pub} cal=${cal} Δ=${delta}">${esc(shortAuid)}</td>`;
    }

    return `<tr class="${rejected ? 'rejected' : ''} obs-clickable" id="obs-${o.id}" data-obs-id="${o.id}">
      <td title="${esc(o.file_name)}">${esc(shortName(o.file_name))}</td>
      <td class="mag">${jd}</td>
      <td class="mag">${mag}</td>
      <td class="mag">${err}</td>
      <td class="mag ${rmsClass(o.fit_rms)}">${rms}</td>
      <td>${o.n_ensemble_stars ?? '—'}</td>
      ${chkCell}
      <td>${am}</td>
      <td>${badge}</td>
      <td>${rejectBtn}</td>
    </tr>`;
  }

  function shortName(path) {
    return path ? path.split('/').pop().split('\\').pop() : '';
  }

  // ── Actions ─────────────────────────────────────────────────────────────────
  async function rejectObs(id, e) {
    e.stopPropagation();
    const reason = prompt('Rejection reason (optional):') ?? '';
    try {
      await api(`/api/observations/${id}/reject`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason }),
      });
      toast('Observation rejected');
      if (expandedJobId) await reloadExpandedJob();
    } catch(ex) { toast(ex.message, true); }
  }

  async function acceptObs(id, e) {
    e.stopPropagation();
    try {
      await api(`/api/observations/${id}/accept`, { method: 'POST' });
      toast('Observation accepted');
      if (expandedJobId) await reloadExpandedJob();
    } catch(ex) { toast(ex.message, true); }
  }

  async function reloadExpandedJob() {
    if (!expandedJobId) return;
    const obsDiv = document.getElementById(`job-obs-${expandedJobId}`);
    if (!obsDiv) return;
    const obs = await api(`/api/jobs/${expandedJobId}/observations`).catch(() => null);
    if (!obs) return;
    currentJobObs[expandedJobId] = obs;
    obsDiv.innerHTML = renderObsTable(expandedJobId, obs);
    attachObsClicks(obsDiv, obs);
  }

  async function saveRunNotes(runId) {
    const text = document.getElementById('run-notes')?.value ?? '';
    try {
      await api(`/api/runs/${runId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes: text }),
      });
    } catch(e) { toast('Failed to save notes', true); }
  }

  async function deleteRun(runId) {
    if (!confirm('Delete this run and all its observations? This cannot be undone.')) return;
    try {
      await api(`/api/runs/${runId}`, { method: 'DELETE' });
      toast('Run deleted');
      stopPolling();
      currentRunId = null;
      expandedJobId = null;
      currentJobObs = {};
      document.getElementById('detail-panel').innerHTML =
        '<div class="empty" style="padding:60px">Select a run or start a new one</div>';
      resetVizPanel();
      loadRuns();
    } catch(e) { toast(e.message, true); }
  }

  async function downloadRunCsv(runId) {
    const r = await fetch(`/api/runs/${runId}/aavso-csv`);
    if (!r.ok) { toast('Failed to generate CSV', true); return; }
    const text = await r.text();
    const blob = new Blob([text], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `AAVSO-run-${runId}.csv`;
    a.click();
  }

  async function downloadJobCsv(jobId) {
    const r = await fetch(`/api/jobs/${jobId}/aavso-csv`);
    if (!r.ok) { toast('Failed to generate CSV', true); return; }
    const text = await r.text();
    const blob = new Blob([text], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `AAVSO-job-${jobId}.csv`;
    a.click();
  }

  async function clearCache() {
    if (!confirm('Delete all cached API responses? The next run will re-fetch from AAVSO.')) return;
    try {
      const result = await api('/api/cache', { method: 'DELETE' });
      toast(`Cache cleared (${result.entries_deleted} entries)`);
    } catch(e) { toast(e.message, true); }
  }

  async function clearAllData() {
    if (!confirm('Delete ALL runs, jobs and observations? This cannot be undone.')) return;
    try {
      const result = await api('/api/data', { method: 'DELETE' });
      toast(`Cleared ${result.jobs_deleted} job(s)`);
      stopPolling();
      currentRunId = null;
      expandedJobId = null;
      currentJobObs = {};
      document.getElementById('detail-panel').innerHTML =
        '<div class="empty" style="padding:60px">Select a run or start a new one</div>';
      resetVizPanel();
      loadRuns();
    } catch(e) { toast(e.message, true); }
  }

  // ── Viz panel ───────────────────────────────────────────────────────────────
  function resetVizPanel() {
    if (ensembleChart) { ensembleChart.destroy(); ensembleChart = null; }
    document.getElementById('viz-filename').textContent = '';
    document.getElementById('viz-empty').style.display = 'block';
    document.getElementById('viz-cards').style.display = 'none';
  }

  function selectObsRow(o) {
    document.querySelectorAll('tr.obs-clickable').forEach(tr => tr.classList.remove('obs-selected'));
    const tr = document.getElementById(`obs-${o.id}`);
    if (tr) tr.classList.add('obs-selected');

    document.getElementById('viz-empty').style.display = 'none';
    document.getElementById('viz-cards').style.display = 'flex';
    document.getElementById('viz-filename').textContent = shortName(o.file_name);

    renderEnsembleChart(o);
    renderCutout(o);
  }

  function renderEnsembleChart(o) {
    if (ensembleChart) { ensembleChart.destroy(); ensembleChart = null; }
    const canvas = document.getElementById('ensemble-chart');
    const extra  = o.extra || {};
    const points = extra.ensemble_points || [];
    const targetInstMag = extra.target_instrumental_mag;

    if (!points.length) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#8b949e'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('No ensemble data', canvas.width / 2, canvas.height / 2);
      return;
    }

    const compData = points.map(p => ({ x: p.instrumental_mag, y: p.published_mag }));
    const xVals = points.map(p => p.instrumental_mag);
    const xMin = Math.min(...xVals) - 0.2;
    const xMax = Math.max(...xVals) + 0.2;
    const fitData = [];
    if (o.fit_slope != null && o.fit_intercept != null) {
      fitData.push({ x: xMin, y: o.fit_slope * xMin + o.fit_intercept });
      fitData.push({ x: xMax, y: o.fit_slope * xMax + o.fit_intercept });
    }
    const targetData = [];
    if (targetInstMag != null && o.magnitude != null) {
      targetData.push({ x: targetInstMag, y: o.magnitude });
    }

    ensembleChart = new Chart(canvas, {
      type: 'scatter',
      data: {
        datasets: [
          { label: 'Comp stars', data: compData, backgroundColor: '#58a6ff', pointRadius: 5 },
          { label: 'Target',     data: targetData, backgroundColor: '#f85149', pointStyle: 'triangle', pointRadius: 8 },
          { label: 'Fit', data: fitData, type: 'line', borderColor: '#8b949e', borderDash: [5,3],
            borderWidth: 1.5, pointRadius: 0, showLine: true },
        ],
      },
      options: {
        animation: false,
        plugins: { legend: { labels: { color: '#c9d1d9', font: { size: 11 } } } },
        scales: {
          x: { title: { display:true, text:'Instrumental mag', color:'#8b949e', font:{size:11} },
               ticks:{color:'#8b949e'}, grid:{color:'#30363d'} },
          y: { title: { display:true, text:'Published mag',    color:'#8b949e', font:{size:11} },
               ticks:{color:'#8b949e'}, grid:{color:'#30363d'}, reverse:true },
        },
      },
    });
  }

  function renderCutout(o) {
    const img = document.getElementById('cutout-img');
    const ph  = document.getElementById('cutout-placeholder');
    img.style.display = 'none'; ph.textContent = 'Loading…'; ph.style.display = 'block';
    img.onload  = () => { img.style.display = 'block'; ph.style.display = 'none'; };
    img.onerror = () => { ph.textContent = 'No cutout available'; };
    img.src = `/api/observations/${o.id}/cutout`;
  }

  // ── Utility ──────────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Directory picker ─────────────────────────────────────────────────────────
  let pickerCurrentPath = null;

  async function openDirPicker() {
    const current = document.getElementById('path-input').value.trim();
    document.getElementById('dir-modal-backdrop').classList.add('open');
    await browseTo(current || null);
  }

  function closeDirPicker() {
    document.getElementById('dir-modal-backdrop').classList.remove('open');
  }

  function confirmDirPicker() {
    if (pickerCurrentPath) {
      document.getElementById('path-input').value = pickerCurrentPath;
    }
    closeDirPicker();
  }

  async function browseTo(path) {
    const entries = document.getElementById('dir-entries');
    entries.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
    try {
      const params = path ? `?path=${encodeURIComponent(path)}` : '';
      const data = await api(`/api/browse${params}`);
      pickerCurrentPath = data.path;
      document.getElementById('dir-modal-path').textContent = data.path;

      let html = '';
      if (data.parent) {
        html += `<div class="dir-entry" data-path="${esc(data.parent)}">
          <span class="dir-icon">↑</span><span style="color:var(--muted)">.. (up)</span>
        </div>`;
      }
      if (!data.entries.length) {
        html += '<div class="empty" style="padding:20px">No subdirectories</div>';
      } else {
        html += data.entries.map(e =>
          `<div class="dir-entry" data-path="${esc(e.path)}">
            <span class="dir-icon">📁</span><span>${esc(e.name)}</span>
          </div>`
        ).join('');
      }
      entries.innerHTML = html;
      entries.querySelectorAll('.dir-entry[data-path]').forEach(el => {
        el.addEventListener('click', () => browseTo(el.dataset.path));
      });
    } catch(ex) {
      entries.innerHTML = `<div class="empty" style="color:var(--fail)">${ex.message}</div>`;
    }
  }

  // Close on backdrop click
  document.getElementById('dir-modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('dir-modal-backdrop')) closeDirPicker();
  });

  // ── Init ─────────────────────────────────────────────────────────────────────
  loadRuns();
  setInterval(loadRuns, 30000);
</script>
</body>
</html>
